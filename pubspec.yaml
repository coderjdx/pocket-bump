name: pocket_bump
description: "A real-world Pokémon encounter and fist-bump battling app for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.1.2
  pedometer: ^4.0.1
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
