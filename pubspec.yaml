name: pocket_bump
description: "A real-world Pokémon encounter and fist-bump battling app for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.1.1
  pedometer: ^4.2.0
  health: ^13.3.2
  provider: ^6.1.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  audioplayers: ">=6.3.0 <6.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/badges/
    - assets/images/balls/
    - assets/images/trainers/
    - assets/audio/bgm/
    - assets/audio/cries/
    - assets/audio/sfx/
