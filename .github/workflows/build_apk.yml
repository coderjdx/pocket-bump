name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Permissions
        run: |
          flutter create --platforms=android --org com.coderjdx --project-name pocket_bump .
          python3 -c '
          import glob, os, re, shutil
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.BODY_SENSORS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.health.READ_STEPS" />
          """
          if "ACTIVITY_RECOGNITION" not in content:
              content = content.replace("<application", perms + "    <application", 1)
          hc_intent = """            <intent-filter>
                  <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
              </intent-filter>
          """
          if "ACTION_SHOW_PERMISSIONS_RATIONALE" not in content:
              content = content.replace("</activity>", hc_intent + "        </activity>", 1)
          hc_alias = """        <activity-alias
                  android:name="ViewPermissionUsageActivity"
                  android:exported="true"
                  android:targetActivity=".MainActivity"
                  android:permission="android.permission.START_VIEW_PERMISSION_USAGE">
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW_PERMISSION_USAGE" />
                      <category android:name="android.category.HEALTH_PERMISSIONS" />
                  </intent-filter>
              </activity-alias>
          """
          if "ViewPermissionUsageActivity" not in content:
              content = content.replace("</activity>", "</activity>\n" + hc_alias, 1)
          hc_queries = """        <package android:name="com.google.android.apps.healthdata" />
                  <intent>
                      <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                  </intent>
          """
          if "com.google.android.apps.healthdata" not in content:
              if "<queries>" in content:
                  content = content.replace("<queries>", "<queries>\n" + hc_queries, 1)
              else:
                  content = content.replace("</manifest>", "    <queries>\n" + hc_queries + "    </queries>\n</manifest>", 1)
          content = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"Pocket Bump\"", content, count=1)
          with open(path, "w") as f:
              f.write(content)
          for kt_path in glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True):
              with open(kt_path, "r") as f:
                  kt = f.read()
              kt = kt.replace("io.flutter.embedding.android.FlutterActivity", "io.flutter.embedding.android.FlutterFragmentActivity")
              kt = re.sub(r"class\s+MainActivity\s*:\s*FlutterActivity\(\)", "class MainActivity : FlutterFragmentActivity()", kt)
              with open(kt_path, "w") as f:
                  f.write(kt)
          shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)
          icon_map = {
              "assets/icons/ic_launcher_mdpi.png": "android/app/src/main/res/mipmap-mdpi/ic_launcher.png",
              "assets/icons/ic_launcher_hdpi.png": "android/app/src/main/res/mipmap-hdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xhdpi.png": "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xxhdpi.png": "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xxxhdpi.png": "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
          }
          for src, dst in icon_map.items():
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(src, dst)
              dst_round = os.path.join(os.path.dirname(dst), "ic_launcher_round.png")
              if os.path.exists(dst_round):
                  shutil.copyfile(src, dst_round)
          gradle_path = "android/app/build.gradle.kts"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 37", g)
          g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 26", g)
          with open(gradle_path, "w") as f:
              f.write(g)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore \
            -srckeystore assets/keystore/android_debug.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -srckeypass android \
            -destkeystore ~/.android/debug.keystore \
            -deststoretype PKCS12 \
            -deststorepass android \
            -destkeypass android \
            -alias androiddebugkey \
            -noprompt

      - name: Build Release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-bump-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pocket Bump v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 Pocket Bump Android APK Release
            - Download `app-release.apk` below directly to your Android device.
            - Tap to install (enable "Install from Unknown Sources" if prompted).
            - Includes background step counter & fistbump combat engine!
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_web:
    name: Build & Deploy Web Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter create --platforms=web .
          mkdir -p web/icons
          cp assets/icons/favicon.png web/favicon.png
          cp assets/icons/apple_touch_icon.png web/icons/apple-touch-icon.png
          cp assets/icons/ic_launcher_xxxhdpi.png web/icons/Icon-192.png
          cp assets/icons/ic_launcher_xxxhdpi.png web/icons/Icon-maskable-192.png
          cp assets/icons/app_icon_512.png web/icons/Icon-512.png
          cp assets/icons/app_icon_512.png web/icons/Icon-maskable-512.png
          flutter pub get
          if ! flutter build web --release --base-href "/pocket-bump/" --pwa-strategy=none --no-web-resources-cdn --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }} > /tmp/web_build.log 2>&1; then
            cat /tmp/web_build.log
            python3 -c 'import sys; log = open("/tmp/web_build.log", errors="replace").read().strip().splitlines(); print("::error::" + " | ".join(log[-25:])[:3500])'
            exit 1
          fi
          python3 tool/build_pwa.py --web-dir build/web --version "1.0.${{ github.run_number }}" --base-href "/pocket-bump/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
