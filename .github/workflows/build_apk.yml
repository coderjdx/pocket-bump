name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Permissions
        run: |
          flutter create --platforms=android --org com.coderjdx --project-name pocket_bump .
          python3 -c '
          import os, re, shutil
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
              <uses-permission android:name="android.permission.BODY_SENSORS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """
          if "ACTIVITY_RECOGNITION" not in content:
              content = content.replace("<application", perms + "    <application", 1)
          content = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"Pocket Bump\"", content, count=1)
          with open(path, "w") as f:
              f.write(content)
          shutil.rmtree("android/app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)
          icon_map = {
              "assets/icons/ic_launcher_mdpi.png": "android/app/src/main/res/mipmap-mdpi/ic_launcher.png",
              "assets/icons/ic_launcher_hdpi.png": "android/app/src/main/res/mipmap-hdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xhdpi.png": "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xxhdpi.png": "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png",
              "assets/icons/ic_launcher_xxxhdpi.png": "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
          }
          for src, dst in icon_map.items():
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(src, dst)
              dst_round = os.path.join(os.path.dirname(dst), "ic_launcher_round.png")
              if os.path.exists(dst_round):
                  shutil.copyfile(src, dst_round)
          gradle_path = "android/app/build.gradle.kts"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          with open(gradle_path, "w") as f:
              f.write(g)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Persistent Signing Keystore
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore \
            -srckeystore assets/keystore/android_debug.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -srckeypass android \
            -destkeystore ~/.android/debug.keystore \
            -deststoretype PKCS12 \
            -deststorepass android \
            -destkeypass android \
            -alias androiddebugkey \
            -noprompt

      - name: Build Release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-bump-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pocket Bump v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 Pocket Bump Android APK Release
            - Download `app-release.apk` below directly to your Android device.
            - Tap to install (enable "Install from Unknown Sources" if prompted).
            - Includes background step counter & fistbump combat engine!
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_web:
    name: Build & Deploy Web Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web
        run: |
          flutter create --platforms=web .
          mkdir -p web/icons
          cp assets/icons/favicon.png web/favicon.png
          cp assets/icons/ic_launcher_xxxhdpi.png web/icons/Icon-192.png
          cp assets/icons/ic_launcher_xxxhdpi.png web/icons/Icon-maskable-192.png
          cp assets/icons/app_icon_512.png web/icons/Icon-512.png
          cp assets/icons/app_icon_512.png web/icons/Icon-maskable-512.png
          flutter pub get
          flutter build web --release --base-href "/pocket-bump/" --pwa-strategy=none --dart-define=APP_VERSION=1.0.${{ github.run_number }}
          python3 -c '
          import json
          with open("build/web/index.html", "r") as f:
              html = f.read()
          html = html.replace("<title>pocket_bump</title>", "<title>Pocket Bump</title>")
          html = html.replace("content=\"pocket_bump\"", "content=\"Pocket Bump\"")
          patch = """<script>
          if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(sw){sw.unregister();});});}
          (function(){
            if(window.__pbMotionInit)return;
            window.__pbMotionInit=true;
            var needsReq=typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function";
            window.__pbMotionState=needsReq?"prompt":"granted";
            window.__pbMotionListeners=[];
            window.__pbMotionBound=false;
            window.__pbStartDeviceMotion=function(){
              if(window.__pbMotionBound)return;
              if(typeof window.addEventListener!=="function")return;
              window.__pbMotionBound=true;
              window.addEventListener("devicemotion",function(e){
                var a=e.accelerationIncludingGravity||e.acceleration;
                if(!a)return;
                if(a.x===null&&a.y===null&&a.z===null)return;
                var x=Number(a.x||0),y=Number(a.y||0),z=Number(a.z||0);
                window.__pbMotionState="granted";
                window.__pbLastMotion={x:x,y:y,z:z,ts:Date.now()};
                var list=window.__pbMotionListeners.slice();
                for(var i=0;i<list.length;i++){
                  var inst=list[i];
                  if(inst&&inst._active){
                    inst.x=x;inst.y=y;inst.z=z;
                    if(typeof inst.onreading==="function"){try{inst.onreading();}catch(_){}}
                  }
                }
              },false);
            };
            var pendingReq=null;
            window.__pbRequestMotionPermission=function(){
              if(!needsReq){
                window.__pbMotionState="granted";
                window.__pbStartDeviceMotion();
                return Promise.resolve(true);
              }
              if(window.__pbMotionState==="granted"){
                window.__pbStartDeviceMotion();
                return Promise.resolve(true);
              }
              if(pendingReq)return pendingReq;
              try{
                pendingReq=Promise.resolve(DeviceMotionEvent.requestPermission()).then(function(res){
                  pendingReq=null;
                  window.__pbMotionState=res||"denied";
                  if(res==="granted"){window.__pbStartDeviceMotion();return true;}
                  return false;
                }).catch(function(){
                  pendingReq=null;
                  return false;
                });
                return pendingReq;
              }catch(_){
                pendingReq=null;
                return Promise.resolve(false);
              }
            };
            if(typeof window.Accelerometer==="undefined"){
              window.Accelerometer=function(opts){
                this.x=0;this.y=0;this.z=0;
                this.onreading=null;this.onerror=null;
                this._active=false;
              };
              window.Accelerometer.prototype.start=function(){
                this._active=true;
                if(window.__pbMotionListeners.indexOf(this)===-1){
                  window.__pbMotionListeners.push(this);
                }
                if(!needsReq||window.__pbMotionState==="granted"){
                  window.__pbStartDeviceMotion();
                }
              };
              window.Accelerometer.prototype.stop=function(){
                this._active=false;
                var idx=window.__pbMotionListeners.indexOf(this);
                if(idx!==-1)window.__pbMotionListeners.splice(idx,1);
              };
            }
            if(!needsReq){window.__pbStartDeviceMotion();}
            var onGesture=function(){
              if(needsReq&&window.__pbMotionState!=="granted"){
                window.__pbRequestMotionPermission();
              }
            };
            document.addEventListener("touchend",onGesture,{capture:true,passive:true});
            document.addEventListener("click",onGesture,{capture:true,passive:true});
          })();
          </script>"""
          if "__pbMotionInit" not in html:
              html = html.replace("</head>", patch + "\n</head>", 1)
          with open("build/web/index.html", "w") as f:
              f.write(html)
          with open("build/web/manifest.json", "r") as f:
              manifest = json.load(f)
          manifest["name"] = "Pocket Bump"
          manifest["short_name"] = "Pocket Bump"
          with open("build/web/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
